[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coform"
version = "0.1.0"
description = "Evidence-led collective design of printable supports"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pydantic>=2.8,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
camera = ["opencv-python>=4.9"]
formlabs = ["formlabs-sdk @ git+https://github.com/Formlabs/formlabs-api-python@aaae10cd92aa4b0ac339153255d9ec978ec74c48"]

[project.scripts]
coform = "coform.cli:main"

[tool.setuptools.packages.find]
include = ["coform*"]

[tool.setuptools.package-data]
coform = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
